[project]
name = "sanskrit-lm"
version = "0.1.0"
description = "Path A — char-level SLP1 Sanskrit specialist model (autoresearch-style harness). Neural proposes, Panini disposes."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "indic-transliteration>=2.3.82",
    "sanskrit-analyzer @ git+https://github.com/naren-m/sanskrit_analyser.git@main",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# CPU/MPS build is fine on Apple Silicon; default PyPI wheels ship MPS support.

[tool.setuptools]
packages = ["slm"]

[tool.pytest.ini_options]
# tests/ imports `slm` from the repo root, which is NOT on sys.path when pytest
# is invoked from elsewhere. Without this every test module dies at collection
# with ModuleNotFoundError: No module named 'slm'.
pythonpath = ["."]
testpaths = ["tests"]
